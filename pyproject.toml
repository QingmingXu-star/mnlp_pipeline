[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurogest-mvp"
version = "0.1.0"
description = "Pinned EuroGEST scoring reproduction for German causal language models"
requires-python = ">=3.11"
dependencies = ["torch==2.9.1", "transformers==4.57.3", "huggingface-hub==0.36.0", "pandas==2.3.3"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
eurogest-evaluate = "eurogest_mvp.evaluate:main"
eurogest-download = "eurogest_mvp.dataset:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires the cached real German GPT-2 model"]
